# Cada push a main: tests y compilación.
# La app se publica en Cloudflare (kai.e3develops.com) con `npm run deploy`.
# GitHub Pages (la dirección antigua) solo sirve la página "KAI se ha mudado" (carpeta mudanza/).
name: Tests y página de mudanza

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  mudanza:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mudanza
      - id: deployment
        uses: actions/deploy-pages@v4
